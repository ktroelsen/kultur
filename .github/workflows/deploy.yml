name: Deploy to Simply

on:
  # Hæng af CI: deploy kører først når CI er grøn på main (ikke parallelt med CI).
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:          # tillader manuel kørsel fra GitHub UI

# Kun én deploy ad gangen, så to samtidige pushes ikke slås om IIS-sitet.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Deploy kun når den udløsende CI-kørsel lykkedes (workflow_dispatch har ingen
    # workflow_run-kontekst, så den lukkes også igennem).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    environment: Production     # binder til GitHub Environment "Production" (secrets ligger der)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Deploy præcis den commit CI validerede (ikke bare tip of main).
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Byg SPA'en og læg den i API'ets wwwroot, så den ene .NET-app serverer både
      # frontend og API under samme origin.
      - name: Build frontend into wwwroot
        shell: pwsh
        run: |
          npm ci --prefix web
          npm run build --prefix web
          Remove-Item -Recurse -Force src/Kultur.Api/wwwroot -ErrorAction SilentlyContinue
          Copy-Item -Recurse web/dist src/Kultur.Api/wwwroot

      # Self-contained win-x86: Simply har ikke .NET 10-runtime, og app poolen kører 32-bit
      # (se docs/simply-deploy.md). Commit-SHA'en vises som version i /api/health.
      - name: Publish backend (self-contained)
        run: dotnet publish src/Kultur.Api/Kultur.Api.csproj -c Release -r win-x86 --self-contained -o publish -p:SourceRevisionId=${{ github.sha }}

      # Hemmeligheder lægges i appsettings.Production.json fra GitHub Secrets, så de aldrig står i
      # repoet. Uden TICKETMASTER_API_KEY springes Ticketmaster over ved scanning, og uden
      # KULTUR_SCAN_KEY kan den natlige scanning ikke kalde /api/scan.
      - name: Configure production secrets
        shell: pwsh
        env:
          KULTUR_PASSWORD: ${{ secrets.KULTUR_PASSWORD }}
          KULTUR_SCAN_KEY: ${{ secrets.KULTUR_SCAN_KEY }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if (-not $env:KULTUR_PASSWORD) {
            Write-Warning "KULTUR_PASSWORD secret not set; login will be disabled in production (503)."
          }
          if (-not $env:KULTUR_SCAN_KEY) {
            Write-Warning "KULTUR_SCAN_KEY secret not set; the nightly scan can't call /api/scan."
          }
          if (-not $env:TICKETMASTER_API_KEY) {
            Write-Warning "TICKETMASTER_API_KEY secret not set; Ticketmaster is skipped when scanning."
          }
          if (-not $env:ANTHROPIC_API_KEY) {
            Write-Warning "ANTHROPIC_API_KEY secret not set; the races look-up (Claude) is skipped."
          }
          # -Depth: ConvertTo-Json stops at depth 2 by default.
          @{
            Auth = @{ Password = $env:KULTUR_PASSWORD }
            Scan = @{ Key = $env:KULTUR_SCAN_KEY }
            Ticketmaster = @{ ApiKey = $env:TICKETMASTER_API_KEY }
            Ai = @{ ApiKey = $env:ANTHROPIC_API_KEY }
          } | ConvertTo-Json -Depth 5 | Set-Content publish/appsettings.Production.json -Encoding utf8

      # Værn: sync sletter alt på sitet, der ikke er i build'et. Står SIMPLY_WEBDEPLOY_SITE til
      # et andet site (fx read.kaspert.dk, hvis secrets er kopieret derfra), ville det blive
      # overskrevet. Derfor deployer vi kun til kultur.kaspert.dk.
      - name: Check deploy secrets and target
        shell: pwsh
        env:
          WEBDEPLOY_SITE: ${{ secrets.SIMPLY_WEBDEPLOY_SITE }}
          WEBDEPLOY_URL: ${{ secrets.SIMPLY_WEBDEPLOY_URL }}
          WEBDEPLOY_USERNAME: ${{ secrets.SIMPLY_WEBDEPLOY_USERNAME }}
          WEBDEPLOY_PASSWORD: ${{ secrets.SIMPLY_WEBDEPLOY_PASSWORD }}
        run: |
          # A missing secret otherwise only shows up as a vague 401 from msdeploy.
          $missing = @('URL', 'SITE', 'USERNAME', 'PASSWORD') |
            Where-Object { -not [Environment]::GetEnvironmentVariable("WEBDEPLOY_$_") } |
            ForEach-Object { "SIMPLY_WEBDEPLOY_$_" }
          if ($missing) {
            Write-Error "Missing secrets in environment Production: $($missing -join ', ')"
            exit 1
          }
          if ($env:WEBDEPLOY_SITE -ne 'kultur.kaspert.dk') {
            Write-Error "SIMPLY_WEBDEPLOY_SITE must be kultur.kaspert.dk; refusing to overwrite another site."
            exit 1
          }

      # Synkronisér publish/ til IIS-sitets rod via Web Deploy. AppOffline stopper appen så
      # de låste exe/dll'er kan udskiftes; App_Data (arrangementer, profiler + nøgler) skippes, så data
      # overlever redeploys. logs/ (ANCM stdout-logs ved fejlfinding) skippes også: en låst
      # logfil fik ellers hele synkroniseringen til at fejle (erfaring fra stamtrae).
      - name: Deploy to Simply via Web Deploy
        shell: pwsh
        env:
          WEBDEPLOY_URL: ${{ secrets.SIMPLY_WEBDEPLOY_URL }}
          WEBDEPLOY_SITE: ${{ secrets.SIMPLY_WEBDEPLOY_SITE }}
          WEBDEPLOY_USERNAME: ${{ secrets.SIMPLY_WEBDEPLOY_USERNAME }}
          WEBDEPLOY_PASSWORD: ${{ secrets.SIMPLY_WEBDEPLOY_PASSWORD }}
        run: |
          $msdeploy = "${env:ProgramFiles}\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          if (-not (Test-Path $msdeploy)) {
            $msdeploy = "${env:ProgramFiles(x86)}\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          }
          if (-not (Test-Path $msdeploy)) {
            Write-Error "msdeploy.exe not found on the runner"
            exit 1
          }

          # Byg hvert argument som én samlet streng (PowerShells komma-split
          # kolliderer ellers med msdeploys komma-separerede provider-settings).
          $source = "-source:contentPath=$PWD\publish"
          $dest = "-dest:contentPath=$($env:WEBDEPLOY_SITE),computerName=https://$($env:WEBDEPLOY_URL):8172/msdeploy.axd?site=$($env:WEBDEPLOY_SITE),userName=$($env:WEBDEPLOY_USERNAME),password=$($env:WEBDEPLOY_PASSWORD),authType=Basic"

          $skipDir = '-skip:objectName=dirPath,absolutePath=.*(App_Data|\\logs).*'
          $skipFile = '-skip:objectName=filePath,absolutePath=.*(App_Data|\\logs\\).*'

          & $msdeploy `
            -verb:sync `
            $source `
            $dest `
            -allowUntrusted `
            -enableRule:AppOffline `
            $skipDir `
            $skipFile

          if ($LASTEXITCODE -ne 0) {
            Write-Error "msdeploy failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
